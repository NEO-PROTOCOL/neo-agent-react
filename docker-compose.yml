
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - neo-agent-pilot-redis:/data

  canvas-ui:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm --dir apps/canvas-ui install && pnpm --dir apps/canvas-ui dev"
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_BASE_URL=http://worker:4001
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    depends_on:
      - redis
      - worker

  worker:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm --dir services/worker install && pnpm --dir services/worker start:api"
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=4001
      - HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "127.0.0.1:4001:4001"
    volumes:
      - ./:/app
    depends_on:
      - redis

volumes:
  neo-agent-pilot-redis:
